<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05070D">
  <meta name="description" content="Solar Map — the real solar system, computed live in your browser: where every planet is for any date from 4000 BC to AD 4000, how far everything is, the alignments worth watching, and cinematic faster-than-light flights between them.">
  <title>Solar Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FFB454'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237AA2FF' stroke-width='1.5'/%3E%3Ccircle cx='27.5' cy='11' r='2.2' fill='%236B93D6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="gl" tabindex="0" aria-label="3D view of the solar system. Drag to look around, pinch or scroll to zoom, tap a planet to select it. Press ? for help."></canvas>
      <div id="labels"></div>
    </div>

    <div id="hud" aria-live="off" aria-label="Date, time speed and camera"></div>

    <div id="toolbar" role="toolbar" aria-label="View controls"></div>

    <aside id="panel" aria-label="Details panel">
      <div class="tabs" role="tablist" aria-label="Panel sections">
        <button class="tab" type="button" role="tab" id="tab-bodies" aria-controls="tabpanel-bodies" aria-selected="true" tabindex="0">Bodies</button>
        <button class="tab" type="button" role="tab" id="tab-events" aria-controls="tabpanel-events" aria-selected="false" tabindex="-1">Events</button>
        <button class="tab" type="button" role="tab" id="tab-distances" aria-controls="tabpanel-distances" aria-selected="false" tabindex="-1">Distances</button>
        <button class="tab" type="button" role="tab" id="tab-flyby" aria-controls="tabpanel-flyby" aria-selected="false" tabindex="-1">Fly</button>
      </div>
      <div class="tabpanel" id="tabpanel-bodies" role="tabpanel" aria-labelledby="tab-bodies" tabindex="0"></div>
      <div class="tabpanel" id="tabpanel-events" role="tabpanel" aria-labelledby="tab-events" tabindex="0" hidden></div>
      <div class="tabpanel" id="tabpanel-distances" role="tabpanel" aria-labelledby="tab-distances" tabindex="0" hidden></div>
      <div class="tabpanel" id="tabpanel-flyby" role="tabpanel" aria-labelledby="tab-flyby" tabindex="0" hidden></div>
    </aside>

    <div id="timeline" role="region" aria-label="Time controls"></div>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="help" hidden></div>

    <!-- Loading screen: the first cinematic frame. Visible until the planetary data module has loaded;
         on failure it stays and shows #load-error above everything else. -->
    <div id="loading" role="status" aria-live="polite" aria-busy="true">
      <div class="load-stars" aria-hidden="true"></div>
      <div class="load-inner">
        <div class="title">Solar Map</div>
        <p class="tagline">The real solar system, computed live in your browser</p>
        <div class="ring" aria-hidden="true"></div>
        <p class="fact" data-fact>Sunlight takes 8 min 19 s to reach Earth — and over 4 hours to reach Neptune.</p>
        <p class="status">Loading the planet positions…</p>
        <div id="load-error" role="alert" hidden>
          <p class="msg"></p>
          <button class="btn primary" type="button">Try again</button>
        </div>
      </div>
      <p class="prov">VSOP87A · IAU 2015 · checked against JPL Horizons</p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
